[project]
name = "project-glacier-control-plane"
version = "0.1.0"
description = "Deterministic local control plane for the Project Glacier workflow"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "mcp_server",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
